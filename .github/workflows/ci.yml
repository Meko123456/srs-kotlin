name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS because the iOS targets need it, and running the suite on a second platform is most of
    # the value of a multiplatform library being multiplatform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Every declared target is covered. The suite actually runs on four of them - the JVM, an iOS
      # simulator, Node and Wasm - which between them cover three different compiler backends, and
      # that is the point of the browser targets being tested rather than merely built: the one place
      # this library could plausibly differ per platform is Double rounding on an interval.
      # iosArm64 cannot run on a runner, so it is compiled, and assemble builds the Android artifact.
      # A target that is published but never built is the gap this line exists to close.
      - name: Test and build every target
        run: |
          ./gradlew :srs:jvmTest \
                    :srs:iosSimulatorArm64Test \
                    :srs:jsNodeTest \
                    :srs:wasmJsNodeTest \
                    :srs:compileKotlinIosArm64 \
                    :srs:assemble --stacktrace

      # Running the sample rather than just compiling it: it is the only place the library is used
      # from outside its own source set, so it is what catches an API change that is awkward to call
      # rather than merely wrong.
      - name: Run the sample
        run: ./gradlew :sample:run --stacktrace

      - name: Upload the test report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: srs/build/reports/tests/
